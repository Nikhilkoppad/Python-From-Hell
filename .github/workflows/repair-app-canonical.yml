name: Temporary App canonical repair

on:
  push:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - '.github/workflows/repair-app-canonical.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'chore: remove temporary app repair workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch App decision handling
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8-sig')
          original = text

          text = text.replace(
              "import type { AIState, LearningPhase, LearningProfile } from './types/learning';",
              "import type { AIState, AdaptiveDecision, LearningPhase, LearningProfile } from './types/learning';",
          )
          text = text.replace(
              "function phaseForChallenge(challenge: Challenge, failures: number, decision?: string): ArenaPhase {\n  if (decision === 'MICRO_LESSON') return 'TEACH';\n  if (decision === 'DEBUG') return 'DEBUG';\n  if (decision === 'INDEPENDENT_RETRY') return 'INDEPENDENT';\n  if (decision === 'BOSS_CHALLENGE') return 'MASTERY';\n  if (decision === 'ADVANCE') return 'MASTERY';",
              "function phaseForChallenge(challenge: Challenge, failures: number, decision?: AdaptiveDecision['action']): ArenaPhase {\n  if (decision === 'MICRO_LESSON' || decision === 'TEACH_AGAIN') return 'TEACH';\n  if (decision === 'DEBUG_CHALLENGE') return 'DEBUG';\n  if (decision === 'INDEPENDENT_CHALLENGE') return 'INDEPENDENT';\n  if (decision === 'BOSS_CHALLENGE') return 'MASTERY';",
          )
          text = text.replace(
              "const moveToNextChallenge = useCallback((profile: AppProgress, decision: any) => {",
              "const moveToNextChallenge = useCallback((profile: AppProgress, decision: AdaptiveDecision) => {",
          )
          text = text.replace(
              "if (action === 'MICRO_LESSON' || action === 'DEBUG' || action === 'INDEPENDENT_RETRY') {",
              "if (action === 'MICRO_LESSON' || action === 'TEACH_AGAIN' || action === 'DEBUG_CHALLENGE' || action === 'INDEPENDENT_CHALLENGE') {",
          )
          text = text.replace(
              "else if (learningResult.decision.action === 'DEBUG')",
              "else if (learningResult.decision.action === 'DEBUG_CHALLENGE')",
          )
          text = text.replace(
              "else if (learningResult.decision.action === 'INDEPENDENT_RETRY')",
              "else if (learningResult.decision.action === 'INDEPENDENT_CHALLENGE')",
          )

          if text == original:
              raise SystemExit('No App changes were applied; expected canonical decision patterns were not found.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit App repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git commit -m 'fix: consume canonical adaptive decisions in App'
          git push
